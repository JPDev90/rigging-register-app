<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Rigging Register</title><style>body{font:16px Arial;margin:0;background:#eef3f5;color:#152a39}main{max-width:600px;margin:auto;background:#fff;min-height:100vh;padding:20px}h1{background:#123f5c;color:#fff;margin:-20px -20px 20px;padding:20px;font-size:22px}input,button{box-sizing:border-box;width:100%;padding:14px;margin:8px 0;font-size:16px;border-radius:8px}button{border:0;color:#fff;background:#123f5c;font-weight:bold}.actions{display:grid;grid-template-columns:1fr 1fr;gap:8px}.pass{background:#197447}.fail{background:#b53232}.missing{background:#b76f18}.decom{background:#59636c}.card{border:1px solid #d6e0e5;border-radius:9px;padding:14px;margin-top:16px}.small{font-size:13px;color:#60717c}</style><main><h1>Rigging Register</h1><p class="small">Upload a client Excel register once, then search equipment and inspect it.</p><input id="file" type="file" accept=".xlsx,.xls"><input id="search" placeholder="Last 3 serial digits" inputmode="numeric"><div id="out"></div><button onclick="exportData()">Export completed report</button></main><script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script><script>let d=JSON.parse(localStorage.rigging||'[]');const n=x=>String(x||'').toLowerCase().replace(/[^a-z0-9]/g,''),v=(r,...a)=>r[Object.keys(r).find(k=>a.some(z=>n(k).includes(z)))]||'',s=r=>String(v(r,'idnumber','serial')),show=()=>{let q=search.value.trim(),r=d.find(x=>s(x).slice(-3)===q);out.innerHTML=r?'<div class="card"><b>'+v(r,'equipmentdescription','item','description')+'</b><p>Serial: '+s(r)+'<br>Owner: '+v(r,'owner')+'<br>DOM: '+v(r,'dateofmanufacture','dom')+'<br>Expiry: '+v(r,'endoflife','expiry')+'<br>Last inspected: '+v(r,'lastinspection')+'</p><div class="actions"><button class="pass" onclick=pass()>Pass</button><button class="fail" onclick=failed()>Failed</button><button class="missing" onclick=missing()>Missing</button><button class="decom" onclick=decom()>Decom</button></div></div>':q?'No matching item':'';window.currentRecord=r};search.oninput=show;file.onchange=async e=>{let w=XLSX.read(await e.target.files[0].arrayBuffer(),{type:'array'});d=w.SheetNames.flatMap(x=>XLSX.utils.sheet_to_json(w.Sheets[x],{defval:''}).filter(y=>s(y)));localStorage.rigging=JSON.stringify(d);alert(d.length+' items saved on this device')};function save(x){if(!window.currentRecord)return;window.currentRecord.result=x;window.currentRecord.date=new Date().toLocaleDateString('en-AU');localStorage.rigging=JSON.stringify(d);alert('Saved '+x);show()}function pass(){save('Pass')}function failed(){save('Failed')}function missing(){save('Missing')}function decom(){save('Decom')}function exportData(){let r=d.filter(x=>x.result),a=document.createElement('a');a.href=URL.createObjectURL(new Blob([JSON.stringify(r,null,2)],{type:'application/json'}));a.download='rigging-report.json';a.click()}</script></html>
