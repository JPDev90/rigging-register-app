<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Rigging Register</title><style>body{font:16px Arial;margin:0;background:#eef3f5;color:#152a39}main{max-width:600px;margin:auto;background:#fff;min-height:100vh;padding:20px}h1{background:#123f5c;color:#fff;margin:-20px -20px 20px;padding:20px;font-size:22px}input,button{box-sizing:border-box;width:100%;padding:14px;margin:8px 0;font-size:16px;border-radius:8px}button{border:0;color:#fff;background:#123f5c;font-weight:bold}.actions{display:grid;grid-template-columns:1fr 1fr;gap:8px}.pass{background:#197447}.fail{background:#b53232}.missing{background:#b76f18}.decom{background:#59636c}.card{border:1px solid #d6e0e5;border-radius:9px;padding:14px;margin-top:16px}.small{font-size:13px;color:#60717c}.notice{background:#e5f1f7;border-radius:8px;padding:10px;margin:8px 0}.ownerLabel{font-size:13px;font-weight:bold;display:block;margin-top:10px}</style><main><h1>Rigging Register</h1><p class="small">Upload a client Excel register, search by last 3 serial digits, then save the inspection result.</p><input id="file" type="file" accept=".xlsx,.xls"><div id="notice" class="notice">No register loaded yet.</div><input id="search" placeholder="Last 3 serial digits" inputmode="numeric" autocomplete="off"><div id="out"></div><button id="export">Download updated Excel register</button></main><script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script><script>let data=JSON.parse(localStorage.getItem('rigging-register-v2')||'[]'),current=null;const file=document.getElementById('file'),search=document.getElementById('search'),out=document.getElementById('out'),notice=document.getElementById('notice');const clean=x=>String(x||'').toLowerCase().replace(/[^a-z0-9]/g,''),esc=x=>String(x??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])),value=(r,...names)=>{let k=Object.keys(r).find(k=>names.some(n=>clean(k).includes(n)));return k===undefined?'':r[k]},serial=r=>String(value(r,'serialnumber','idnumber','serial','idno','identifier')||''),last3=r=>serial(r).slice(-3),item=r=>value(r,'equipmentdescription','item','description','equipment','product'),ownerFix={'291198-031':'Dan'},owner=r=>r['Actual owner']||ownerFix[serial(r)]||value(r,'owner'),updateNotice=()=>notice.textContent=data.length?data.length+' items loaded on this device.':'No register loaded yet.';function parseSheet(ws){let rows=XLSX.utils.sheet_to_json(ws,{header:1,defval:'',raw:false}),header=-1;for(let i=0;i<Math.min(40,rows.length);i++){let h=rows[i].map(clean),a=h.some(x=>/serial|idnumber|idno|identifier/.test(x)),b=h.some(x=>/item|equipment|description|product/.test(x));if(a&&b){header=i;break}}if(header<0)return[];let keys=rows[header].map((x,i)=>String(x||'Column '+(i+1)));return rows.slice(header+1).filter(row=>row.some(x=>String(x).trim())).map(row=>Object.fromEntries(keys.map((k,i)=>[k,row[i]??'']))).filter(r=>serial(r))}file.addEventListener('change',async e=>{try{let w=XLSX.read(await e.target.files[0].arrayBuffer(),{type:'array',cellDates:true});data=w.SheetNames.flatMap(n=>parseSheet(w.Sheets[n]));if(!data.length)throw Error('No equipment rows found.');localStorage.setItem('rigging-register-v2',JSON.stringify(data));updateNotice();out.innerHTML='';alert(data.length+' items loaded.');}catch(err){notice.textContent='Could not read this register: '+err.message;}});function show(){let q=search.value.trim().toLowerCase();if(!q){out.innerHTML='';return}let matches=data.filter(r=>last3(r).toLowerCase()===q);if(!matches.length)matches=data.filter(r=>serial(r).toLowerCase().includes(q));current=matches[0]||null;if(!current){out.innerHTML='<p class="notice">No matching item found.</p>';return}out.innerHTML='<div class="card"><b>'+esc(item(current)||'Unlabelled item')+'</b><p>Serial: '+esc(serial(current))+'<br>Owner: '+esc(owner(current))+'<br>DOM: '+esc(value(current,'dateofmanufacture','dom'))+'<br>Expiry: '+esc(value(current,'endoflife','expiry'))+'<br>Last inspected: '+esc(value(current,'lastinspection'))+'<br>Current status: '+esc(current['Inspection result']||current['Status']||'Not inspected')+'</p><label class="ownerLabel">Actual equipment owner</label><input id="ownerEdit" value="'+esc(owner(current))+'"><div class="actions"><button class="pass" data-result="Inspection Pass">Inspection Pass</button><button class="fail" data-result="Inspection Failed">Inspection Failed</button><button class="missing" data-result="Missing">Missing</button><button class="decom" data-result="Decom">Decom</button></div></div>';document.getElementById('ownerEdit').addEventListener('change',e=>{current['Actual owner']=e.target.value.trim();localStorage.setItem('rigging-register-v2',JSON.stringify(data));show()})}search.addEventListener('input',show);out.addEventListener('click',e=>{let result=e.target.dataset.result;if(!result||!current)return;current['Inspection result']=result;current['Inspection date']=new Date().toLocaleDateString('en-AU');localStorage.setItem('rigging-register-v2',JSON.stringify(data));alert('Saved: '+result);show()});document.getElementById('export').addEventListener('click',()=>{if(!data.length)return alert('Load a register first.');let wb=XLSX.utils.book_new();XLSX.utils.book_append_sheet(wb,XLSX.utils.json_to_sheet(data),'Rigging Register');XLSX.writeFile(wb,'rigging-register-updated.xlsx')});updateNotice();</script></html>
